[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-magnetapi"
version = "0.1.0"
description = "Python CLI for magnetDB - utilities to interact with MagnetDB"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Remi Caumette", email = "remicaumette@icloud.com"}
]
maintainers = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.32.3",
    "pandas>=2.2.1",
    "numpy>=2.2.1",
    "scipy>=1.14.1",
    "param>=1.12.0",
    "rich>=9.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov",
]
doc = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme",
]
full = [
    "python-magnetsetup",
    "python-magnetcooling",
    "magnettools"
]

[project.scripts]
python_magnetapi = "python_magnetapi.cli:main"

[project.urls]
Homepage = "https://github.com/Trophime/python_magnetapi"
Repository = "https://github.com/Trophime/python_magnetapi"
Documentation = "https://github.com/Trophime/python_magnetapi"
"Bug Tracker" = "https://github.com/Trophime/python_magnetapi/issues"

[tool.setuptools]
packages = [
    "python_magnetapi",
    "python_magnetapi.cli",
    "python_magnetapi.cli.commands",
]

[tool.setuptools.package-data]
python_magnetapi = ["py.typed"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Coverage configuration
[tool.coverage.run]
source = ["python_magnetapi"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]