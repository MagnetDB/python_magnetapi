[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-magnetapi"
version = "0.1.1"
description = "Python CLI for magnetDB - utilities to interact with MagnetDB"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"},
    {name = "Remi Caumette", email = "remicaumette@icloud.com"}
]
maintainers = [
    {name = "Christophe Trophime", email = "christophe.trophime@lncmi.cnrs.fr"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.32.3",
    "pandas>=2.2.1",
    "numpy>=2.2.1",
    "scipy>=1.14.1",
    "param>=1.12.0",
    "rich>=9.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov",
    "ruff",
    "ty",
]
doc = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme",
]
full = [
    "python-magnetsetup",
    "python-magnetcooling",
    "magnettools"
]

[project.scripts]
python_magnetapi = "python_magnetapi.cli:main"

[project.urls]
Homepage = "https://github.com/MagnetDB/python_magnetapi"
Repository = "https://github.com/MagnetDB/python_magnetapi"
Documentation = "https://github.com/MagnetDB/python_magnetapi"
"Bug Tracker" = "https://github.com/MagnetDB/python_magnetapi/issues"

[tool.setuptools]
packages = [
    "python_magnetapi",
    "python_magnetapi.cli",
    "python_magnetapi.cli.commands",
]

[tool.setuptools.package-data]
python_magnetapi = ["py.typed"]

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["old", "debian", "python_magnetsetup", "python_magnetcooling"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

# ty configuration
[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = ["old", "debian", "python_magnetsetup", "python_magnetcooling"]

[tool.ty.rules]
# magnettools, python_magnetsetup, python_magnetgeo and python_magnetrun are
# not on PyPI, so they cannot be installed in the pre-commit environment
unresolved-import = "warn"

# Bandit configuration
[tool.bandit]
exclude_dirs = [
    "tests",
    "old",
    "debian",
    "python_magnetsetup",
    "python_magnetcooling",
    ".venv",
    "venv",
]

# Coverage configuration
[tool.coverage.run]
source = ["python_magnetapi"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]